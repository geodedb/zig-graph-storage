---
# GitLab CI/CD Pipeline for zig-template
# SPDX-License-Identifier: Apache-2.0
#
# Build, test, security scanning, and release pipeline.
#
# Future agent notes:
# - CI catalog components intentionally use protected release tags instead of
#   commit SHAs. Upstream immutability and review controls live in the shared
#   catalog; do not reopen repo-local SHA pinning unless that platform policy changes.
# - Docker image digest pinning is handled by downstream platform controls, so
#   this repository intentionally does not hard-pin image digests here.
# - Pre-commit remains a fast local subset; GitLab CI is the authoritative gate.

default:
  tags:
    - company
    # The group's Windows runner also carries the `company` tag and was
    # picking up Linux shell jobs; require a Linux runner.
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - prepare
  - lint
  - build
  - test
  - fuzz
  - performance
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    # Reuse a cached/artifact Zig only if it runs on this runner: jobs land on
    # both x86_64 and aarch64 runners, so a binary from another job can be the
    # wrong architecture ("cannot execute binary file: Exec format error").
    if ! "./zig-${ZIG_VERSION}/zig" version >/dev/null 2>&1; then
      rm -rf "zig-${ZIG_VERSION}"
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

.zig-job: &zig-job
  image: debian:bookworm-slim
  before_script:
    # Zig fetches git+https:// dependencies in `zig build`; the slim image has
    # no CA bundle, so TLS handshake fails with TlsInitializationFailed.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates git
    # The prepare-zig artifact may come from a runner of another architecture;
    # install-zig keeps it when it runs here and re-downloads it otherwise.
    - *install-zig
  cache:
    key: zig-${ZIG_VERSION}
    paths:
      - .zig-cache/

prepare-zig:
  stage: prepare
  image: debian:bookworm-slim
  script:
    - *install-zig
  artifacts:
    paths:
      - zig-${ZIG_VERSION}/
    expire_in: 1 day
  cache:
    key: zig-${ZIG_VERSION}
    paths:
      - zig-${ZIG_VERSION}/

build:
  <<: *zig-job
  stage: build
  needs:
    - job: prepare-zig
      artifacts: true
  script:
    - zig build

precommit-config-validate:
  stage: lint
  image: python:3.14-slim
  script:
    - pip install --disable-pip-version-check pre-commit
    - pre-commit validate-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test-unit:
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - zig build test --summary all

test-integration:
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - zig build test-integration --summary all

fuzz-regression:
  <<: *zig-job
  stage: fuzz
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - zig build test-fuzz-regression --summary all

fuzz-exploratory:
  <<: *zig-job
  stage: fuzz
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - |
      set +e
      timeout 120 zig build test --fuzz --summary all
      status=$?
      set -e
      if [ "$status" -eq 124 ]; then
        echo "Exploratory fuzz timed out after 120s."
        exit 0
      fi
      exit "$status"
  allow_failure: true

benchmark-regression:
  <<: *zig-job
  stage: performance
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - mkdir -p benchmarks/results
    - zig build scale-bench -- 1K > benchmarks/results/current-ci.json
    - zig build compare-bench -- benchmarks/results/ci-baseline.json benchmarks/results/current-ci.json
  artifacts:
    paths:
      - benchmarks/results/current-ci.json
    expire_in: 30 days
  # Shared GitLab runners produce high variance (mixed.stddev can easily move
  # ±300%). Keep the data but don't block the pipeline on environmental noise.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

benchmark-regression-10k:
  <<: *zig-job
  stage: performance
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - mkdir -p benchmarks/results
    - zig build scale-bench -- 10K > benchmarks/results/current-ci-10k.json
    - zig build compare-bench -- benchmarks/results/ci-10k-baseline.json benchmarks/results/current-ci-10k.json
  artifacts:
    paths:
      - benchmarks/results/current-ci-10k.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  needs:
    - job: prepare-zig
      artifacts: true
  before_script:
    - *install-zig
  cache:
    key: zig-${ZIG_VERSION}
    paths:
      - .zig-cache/

# Disable merge_request_event pipelines. Jobs without rules never run in MR
# pipelines, so the few MR-ruled jobs fail on `needs:` of jobs that are not
# there ("error on the CI/CD configuration file"), and that failed MR pipeline
# becomes the head pipeline that blocks auto-merge. Branch pipelines carry the
# real jobs; evaluate those. (Same fix as devnw/zig/uuid fc0d25fd.)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.14-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

# SONNY-4848: verify the filtered package, including crash-replay regressions.
test-source-package:
  # SONNY-4889: tarfile data filters require the supported Python runtime.
  image: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - python3 scripts/check_source_package.py --jobs 2
  allow_failure: false
