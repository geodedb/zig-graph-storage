---
# GitLab CI/CD Pipeline for zig-template
# SPDX-License-Identifier: Apache-2.0
#
# Build, test, security scanning, and release pipeline.
#
# Future agent notes:
# - CI catalog components intentionally use protected release tags instead of
#   commit SHAs. Upstream immutability and review controls live in the shared
#   catalog; do not reopen repo-local SHA pinning unless that platform policy changes.
# - Docker image digest pinning is handled by downstream platform controls, so
#   this repository intentionally does not hard-pin image digests here.
# - Pre-commit remains a fast local subset; GitLab CI is the authoritative gate.

default:
  interruptible: true
  tags:
    - company
    # The group's Windows runner also carries the `company` tag and was
    # picking up Linux shell jobs; require a Linux runner.
    - linux
    # Keep these jobs on Linux AMD64 runners.
    - amd64

include:
  # Exercise the portable UUID/WAL entropy path on macOS before Geode consumes it.
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@55d86c5ce70793e9e01c2b2d369d1d449b6d5fbc
    inputs:
      tags: [dedicated, macos, arm]
      zig_version: "0.16.0"
      job_suffix: "-portable-deps"
      test_step: test
      test_options: "test-integration -j2 --summary all"
      allow_failure: false

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - prepare
  - lint
  - build
  - test
  - fuzz
  - performance
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    # Reuse a cached/artifact Zig only if it runs on this runner: jobs land on
    # both x86_64 and aarch64 runners, so a binary from another job can be the
    # wrong architecture ("cannot execute binary file: Exec format error").
    if ! "./zig-${ZIG_VERSION}/zig" version >/dev/null 2>&1; then
      rm -rf "zig-${ZIG_VERSION}"
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

.zig-job: &zig-job
  image: debian:bookworm-slim
  before_script:
    # Zig fetches git+https:// dependencies in `zig build`; the slim image has
    # no CA bundle, so TLS handshake fails with TlsInitializationFailed.
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates git
    # The prepare-zig artifact may come from a runner of another architecture;
    # install-zig keeps it when it runs here and re-downloads it otherwise.
    - *install-zig
  variables:
    ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  cache:
    key:
      prefix: "zig-compile-${ZIG_VERSION}-linux-amd64-${CI_JOB_NAME}"
      files: [build.zig.zon]
    paths: [.zig-cache/, .zig-global-cache/]
  after_script:
    - |
      size=$(du -sm .zig-cache .zig-global-cache 2>/dev/null | awk '{sum += $1} END {print sum+0}')
      if [ "$size" -gt 2048 ]; then rm -rf .zig-cache .zig-global-cache; fi

prepare-zig:
  stage: prepare
  image: debian:bookworm-slim
  script:
    - *install-zig
  artifacts:
    paths:
      - zig-${ZIG_VERSION}/
    expire_in: 1 day
  cache:
    key: "zig-toolchain-${ZIG_VERSION}-linux-amd64"
    paths:
      - zig-${ZIG_VERSION}/

build:
  <<: *zig-job
  stage: build
  needs:
    - job: prepare-zig
      artifacts: true
  script:
    - zig build

precommit-config-validate:
  stage: lint
  image: python:3.15-slim
  script:
    - pip install --disable-pip-version-check pre-commit
    - pre-commit validate-config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test-unit:
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - zig build test --summary all

test-integration:
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - zig build test-integration --summary all

fuzz-regression:
  <<: *zig-job
  stage: fuzz
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - zig build test-fuzz-regression --summary all

benchmark-regression:
  <<: *zig-job
  stage: performance
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - mkdir -p benchmarks/results
    - zig build scale-bench -- 1K > benchmarks/results/current-ci.json
    # SONNY-6470: compare against the 1K run of the last successful
    # default-branch pipeline, which ran on the same runner class, instead of
    # the committed workstation baseline (its numbers do not transfer to CI
    # runners). The committed file is only the fallback for a first run or an
    # expired artifact.
    - |
      baseline=benchmarks/results/ci-baseline.json
      url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_DEFAULT_BRANCH}/raw/benchmarks/results/current-ci.json?job=${CI_JOB_NAME}"
      if curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" -o benchmarks/results/default-branch-ci.json "$url"; then
        baseline=benchmarks/results/default-branch-ci.json
        echo "baseline: ${CI_DEFAULT_BRANCH} artifact of ${CI_JOB_NAME}"
      else
        echo "baseline: no ${CI_DEFAULT_BRANCH} artifact; using the committed ci-baseline.json (workstation numbers, not representative of CI runners)"
      fi
      zig build compare-bench -- "$baseline" benchmarks/results/current-ci.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/current-ci.json
    expire_in: 30 days
  # Shared GitLab runners produce high variance (mixed.stddev can easily move
  # ±300%). Keep the data but don't block the pipeline on environmental noise.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

benchmark-regression-10k:
  <<: *zig-job
  stage: performance
  needs:
    - job: prepare-zig
      artifacts: true
    - test-unit
  script:
    - mkdir -p benchmarks/results
    - zig build scale-bench -- 10K > benchmarks/results/current-ci-10k.json
    - zig build compare-bench -- benchmarks/results/ci-10k-baseline.json benchmarks/results/current-ci-10k.json
  artifacts:
    when: always
    paths:
      - benchmarks/results/current-ci-10k.json
    expire_in: 30 days
  # Advisory, like benchmark-regression above and thread-pool's benchmark
  # jobs. A manual job without allow_failure leaves every default-branch
  # pipeline "blocked" and never complete, and a failing job in the
  # performance stage skips the security (gitleaks) and sbom stages after it.
  # The comparison stays visible in the job log and artifact.
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

# SONNY-6470: the Lever B clean-restart tests (derived indexes load on a
# clean restart and are reconciled or rebuilt after a crash) stay out of
# test-integration because they take about 7 minutes, in Debug and in
# ReleaseSafe alike (the time is the checkpoints' disk syncs, not codegen).
# Their own job runs them in parallel with test-integration instead.
test-leverb-clean-restart:
  <<: *zig-job
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - zig build test-leverb-clean-restart --summary all

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  needs:
    - job: prepare-zig
      artifacts: true
  before_script:
    - *install-zig
  cache: []

# Disable merge_request_event pipelines. Jobs without rules never run in MR
# pipelines, so the few MR-ruled jobs fail on `needs:` of jobs that are not
# there ("error on the CI/CD configuration file"), and that failed MR pipeline
# becomes the head pipeline that blocks auto-merge. Branch pipelines carry the
# real jobs; evaluate those. (Same fix as devnw/zig/uuid fc0d25fd.)
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

# SONNY-4848: verify the filtered package, including crash-replay regressions.
test-source-package:
  <<: *zig-job
  # SONNY-4889: override the anchor after expansion in GitLab.
  image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
  stage: test
  needs:
    - job: prepare-zig
      artifacts: true
    - build
  script:
    - python3 scripts/check_source_package.py --jobs 2
  allow_failure: false

zig-test-macos-portable-deps-0.16.0:
  needs: []
  variables:
    ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  cache:
    key:
      prefix: "zig-macos-0.16.0-aarch64"
      files: [build.zig.zon]
    paths: [zig-0.16.0/, .zig-global-cache/, .zig-cache/]
  after_script:
    - |
      size=$(du -sm .zig-cache .zig-global-cache 2>/dev/null | awk '{sum += $1} END {print sum+0}')
      if [ "$size" -gt 2048 ]; then rm -rf .zig-cache .zig-global-cache; fi
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
